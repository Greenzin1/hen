<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hen</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <!-- AUTH SCREENS -->
  <div id="auth-screen" class="screen">
    <div class="auth-left">
      <div class="auth-logo"><svg viewBox="0 0 100 100" width="80" height="80" fill="currentColor"><ellipse cx="50" cy="62" rx="28" ry="24"/><ellipse cx="50" cy="35" rx="14" ry="14"/><circle cx="54" cy="33" r="3" fill="#fff"/><circle cx="55" cy="33" r="1.5"/><path d="M62 37l8 0-4-3z"/><path d="M46 25c-2-6 0-12 4-14 0 4-1 8-4 14z" fill="#e0245e"/><path d="M50 22c-1-5 1-10 5-11 0 3 0 7-5 11z" fill="#e0245e"/><path d="M54 24c0-4 2-8 5-9 0 3-1 6-5 9z" fill="#e0245e"/><path d="M28 68l-6 12 8-4 8 4-6-12z"/><path d="M72 68l6 12-8-4-8 4 6-12z"/><path d="M74 52l10-8-2 10z"/></svg></div>
      <h1>Hen</h1>
      <p>Veja o que está acontecendo agora</p>
    </div>
    <div class="auth-right">
      <div class="auth-box">
        <h2>Crie sua conta</h2>
        <form id="signup-form">
          <input type="text" id="signup-displayname" placeholder="Nome" required>
          <input type="text" id="signup-username" placeholder="Usuário" required>
          <input type="email" id="signup-email" placeholder="Email" required>
          <input type="password" id="signup-password" placeholder="Senha" required>
          <button type="submit" class="btn-primary">Cadastrar</button>
        </form>
        <p class="auth-switch">Já tem conta? <a href="#" onclick="showLogin()">Entrar</a></p>
      </div>
      <div id="login-box" class="auth-box" style="display:none">
        <h2>Entrar no Hen</h2>
        <form id="login-form">
          <input type="text" id="login-user" placeholder="Usuário ou email" required>
          <input type="password" id="login-pass" placeholder="Senha" required>
          <button type="submit" class="btn-primary">Entrar</button>
        </form>
        <p class="auth-switch">Não tem conta? <a href="#" onclick="showSignup()">Cadastrar</a></p>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-screen" class="screen" style="display:none">
    <!-- LEFT NAV -->
    <nav class="left-nav">
      <div class="nav-logo" onclick="go('/')"><svg viewBox="0 0 100 100" width="32" height="32" fill="currentColor"><ellipse cx="50" cy="62" rx="28" ry="24"/><ellipse cx="50" cy="35" rx="14" ry="14"/><circle cx="54" cy="33" r="3" fill="#fff"/><circle cx="55" cy="33" r="1.5"/><path d="M62 37l8 0-4-3z"/><path d="M46 25c-2-6 0-12 4-14 0 4-1 8-4 14z" fill="#e0245e"/><path d="M50 22c-1-5 1-10 5-11 0 3 0 7-5 11z" fill="#e0245e"/><path d="M54 24c0-4 2-8 5-9 0 3-1 6-5 9z" fill="#e0245e"/><path d="M28 68l-6 12 8-4 8 4-6-12z"/><path d="M72 68l6 12-8-4-8 4 6-12z"/><path d="M74 52l10-8-2 10z"/></svg></div>
      <ul class="nav-items">
        <li class="nav-item active" onclick="go('/')"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span><span class="nav-label">Home</span></li>
        <li class="nav-item" onclick="go('/explore')"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span><span class="nav-label">Explorar</span></li>
        <li class="nav-item" onclick="go('/notifications')"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></span><span class="nav-label">Notificações</span></li>
        <li class="nav-item" onclick="go('/profile/'+current_user.username)"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span><span class="nav-label">Perfil</span></li>
        <li class="nav-item" onclick="go('/more')"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span><span class="nav-label">Mais</span></li>
      </ul>
      <button class="btn-tweet" onclick="openCompose()"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="margin-right:8px"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Postar</button>
      <div class="nav-profile" onclick="go('/profile/'+current_user.username)">
        <div class="avatar avatar-sm" id="nav-avatar"></div>
        <div class="nav-profile-info">
          <span class="nav-displayname" id="nav-displayname"></span>
          <span class="nav-username" id="nav-username"></span>
        </div>
      </div>
    </nav>

    <!-- CENTER CONTENT -->
    <main class="center-content">
      <!-- COMPOSE MODAL -->
      <div id="compose-modal" class="modal" style="display:none">
        <div class="modal-backdrop" onclick="closeCompose()"></div>
        <div class="compose-dialog">
          <div class="compose-header">
            <button class="close-btn" onclick="closeCompose()"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
          </div>
          <div class="compose-body">
            <div class="avatar" id="compose-avatar"></div>
            <textarea id="compose-input" placeholder="O que está acontecendo?" maxlength="280"></textarea>
          </div>
          <div class="compose-footer">
            <span id="char-count">280</span>
            <button class="btn-tweet-sm" onclick="submitPost()">Postar</button>
          </div>
        </div>
      </div>

      <!-- VIEWS -->
      <div id="view-home"></div>
      <div id="view-explore" style="display:none"></div>
      <div id="view-profile" style="display:none"></div>
      <div id="view-post" style="display:none"></div>
      <div id="view-notifications" style="display:none"></div>
      <div id="view-more" style="display:none"></div>
      <div id="view-tag" style="display:none"></div>
    </main>

    <!-- RIGHT SIDEBAR -->
    <aside class="right-sidebar">
      <div class="search-box">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="#657786" style="position:absolute;left:12px;top:50%;transform:translateY(-50%)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="search-input" placeholder="Buscar no Hen" onkeyup="if(event.key==='Enter')doSearch()">
        </div>
      </div>
      <div class="trends-box">
        <h3>Assuntos do momento</h3>
        <div id="trends-list"></div>
      </div>
      <div class="follow-box">
        <h3>Quem seguir</h3>
        <div id="suggestions-list"></div>
      </div>
    </aside>
  </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
